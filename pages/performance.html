<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyMind — Performance</title>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast-container"></div>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/shared.js"></script>
<script>
checkAuth();

const periods = {
  '7d':  { labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], acc:[62,65,68,64,72,75,76], tasks:[40,55,50,70,60,75,82] },
  '30d': { labels:['W1','W2','W3','W4','W5','W6','W7','W8'], acc:[58,61,60,65,68,70,73,76], tasks:[35,42,50,55,58,62,68,74] },
  '90d': { labels:['M1','M2','M3'], acc:[52,64,76], tasks:[38,56,74] },
};
let activePeriod = '7d';

function buildRadarSVG(subjects) {
  const cx = 180, cy = 180, r = 130;
  const n = subjects.length;
  const angle = i => (i * 2 * Math.PI / n) - Math.PI/2;
  const pt = (i, pct) => {
    const a = angle(i), dist = r * pct / 100;
    return [cx + dist * Math.cos(a), cy + dist * Math.sin(a)];
  };
  const gridCircles = [20,40,60,80,100].map(p =>
    `<polygon points="${subjects.map((_,i) => pt(i,p).join(',')).join(' ')}" fill="none" stroke="rgba(148,163,184,0.06)" stroke-width="1"/>`
  ).join('');
  const axes = subjects.map((_,i) => {
    const [x,y] = pt(i,100);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(148,163,184,0.06)" stroke-width="1"/>`;
  }).join('');
  const labels = subjects.map((s,i) => {
    const [x,y] = pt(i,118);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#64748B" font-family="Inter">${s.name}</text>`;
  }).join('');
  const dataPoints = subjects.map((_,i) => pt(i, subjects[i].accuracy));
  const polygon = `<polygon points="${dataPoints.map(p=>p.join(',')).join(' ')}" fill="rgba(99,102,241,0.15)" stroke="#6366F1" stroke-width="2"/>`;
  const dots = dataPoints.map(([x,y],i) => `<circle cx="${x}" cy="${y}" r="4" fill="#0B0F1A" stroke="${subjects[i].color}" stroke-width="2"/>`).join('');
  return `<svg viewBox="0 0 360 360" style="width:100%;max-width:360px;display:block;margin:0 auto">
    ${gridCircles}${axes}${labels}${polygon}${dots}
  </svg>`;
}

function buildHeatmap() {
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const weeks = 12;
  const data = Array.from({length:weeks*7}, () => Math.random() > 0.3 ? Math.floor(Math.random()*4)+1 : 0);
  const colors = ['var(--bg-3)', 'rgba(99,102,241,0.20)', 'rgba(99,102,241,0.40)', 'rgba(99,102,241,0.65)', 'rgba(99,102,241,0.90)'];
  return `
    <div style="overflow-x:auto">
      <div style="display:flex;gap:4px;align-items:flex-start;min-width:fit-content">
        <div style="display:flex;flex-direction:column;gap:3px;margin-top:18px">
          ${days.map(d=>`<div style="font-size:10px;color:var(--fg-4);height:13px;line-height:13px;width:28px">${d}</div>`).join('')}
        </div>
        <div>
          <div style="display:flex;gap:3px;margin-bottom:4px">
            ${Array.from({length:weeks},(_,w)=>`<div style="font-size:10px;color:var(--fg-4);width:13px;text-align:center">${w+1}</div>`).join('')}
          </div>
          <div style="display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px">
            ${data.map(v=>`<div style="width:13px;height:13px;border-radius:3px;background:${colors[v]};transition:all 200ms" title="${v} tasks"></div>`).join('')}
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--fg-4)">
        Less ${colors.map(c=>`<span style="width:10px;height:10px;border-radius:2px;background:${c};display:inline-block"></span>`).join('')} More
      </div>
    </div>`;
}

function setPeriod(p) {
  activePeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('btn--secondary', b.dataset.p === p));
  document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('btn--ghost', b.dataset.p !== p));
  const d = periods[p];
  document.getElementById('perf-chart-wrap').innerHTML = buildPerfChart(d.labels, d.acc, d.tasks, 600, 200);
}

function render() {
  const s = State;

  // KPI from dashboard API
  const totalRespostas = _dashData ? _dashData.totalRespostas : '—';
  const taxaGeral      = _dashData ? Math.round(_dashData.taxaAcertoGeral * 100) + '%' : '—%';
  const totalAcertos   = _dashData ? _dashData.totalAcertos : '—';

  // AI insights from recommendation API
  const insightCards = [];
  if (_recomData) {
    if (_recomData.mensagemMotivacional) {
      insightCards.push({ ico:'flame', text:_recomData.mensagemMotivacional, meta:'Motivação · StudyMind AI', color:'#FBBF24' });
    }
    (_recomData.topicosPrioritarios || []).slice(0,2).forEach(t => {
      insightCards.push({ ico:'alert', text:`Priorize: ${t.topicoNome || t.nome} (${t.materiaNome || ''})`, meta:'Tópico prioritário', color:'#FB7185' });
    });
    (_recomData.dicasPraticas || []).slice(0, 3 - insightCards.length).forEach(d => {
      insightCards.push({ ico:'zap', text:d, meta:'Dica prática · StudyMind AI', color:'var(--emerald-400)' });
    });
  }
  if (!insightCards.length) {
    insightCards.push(
      { ico:'zap',   text:"Keep studying consistently to improve your accuracy.",    meta:'StudyMind AI', color:'var(--emerald-400)' },
      { ico:'alert', text:'Focus on topics with low accuracy rates.',                meta:'StudyMind AI', color:'#FB7185' },
      { ico:'flame', text:'Track your progress daily for best results.',             meta:'StudyMind AI', color:'#FBBF24' }
    );
  }

  document.getElementById('app').innerHTML = `
    ${buildSidebar('performance')}
    <div>
      ${buildTopbar('Workspace','Performance')}
      <main class="main page-enter">

        <div class="section__head">
          <div>
            <h1 class="section__title">${icon('trending',20)} Performance analytics</h1>
            <p class="section__sub">Track your accuracy, streak, and subject evolution over time</p>
          </div>
          <button class="btn btn--ghost btn--sm" onclick="showToast('Report exported!')">${icon('filter',12)} Export report</button>
        </div>

        <!-- Top stats -->
        <div class="grid-4" style="margin-top:20px">
          <div class="card stat card--hover">
            <div class="stat__head"><div class="stat__icon stat__icon--am">${icon('flame',16)}</div></div>
            <div class="stat__label">Total respostas</div>
            <div class="stat__value">${totalRespostas}</div>
            <div class="stat__sub">Todas as matérias</div>
          </div>
          <div class="card stat card--hover">
            <div class="stat__head"><div class="stat__icon">${icon('target',16)}</div></div>
            <div class="stat__label">Taxa de acerto</div>
            <div class="stat__value">${taxaGeral}</div>
            <div class="stat__sub">Média geral</div>
          </div>
          <div class="card stat card--hover">
            <div class="stat__head"><div class="stat__icon stat__icon--em">${icon('check-circle',16)}</div></div>
            <div class="stat__label">Total acertos</div>
            <div class="stat__value">${totalAcertos}</div>
            <div class="stat__sub">Questões corretas</div>
          </div>
          <div class="card stat card--hover">
            <div class="stat__head"><div class="stat__icon stat__icon--sky">${icon('bar-chart',16)}</div></div>
            <div class="stat__label">Matérias analisadas</div>
            <div class="stat__value">${s.subjects.length || '—'}</div>
            <div class="stat__sub">Com dados de diagnóstico</div>
          </div>
        </div>

        <!-- Main chart -->
        <section class="section">
          <div class="card card--padded">
            <div class="card__header">
              <div>
                <div class="card__title">${icon('trending',16)} Accuracy & task completion</div>
                <div class="card__sub">Daily performance trend</div>
              </div>
              <div class="row" style="gap:6px">
                ${['7d','30d','90d'].map(p=>`<button class="btn btn--sm period-btn${p==='7d'?' btn--secondary':' btn--ghost'}" data-p="${p}" onclick="setPeriod('${p}')">${p}</button>`).join('')}
              </div>
            </div>
            <div id="perf-chart-wrap" style="height:220px"></div>
            <div style="display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-1)">
              <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3)"><span style="width:10px;height:10px;border-radius:3px;background:#818CF8;display:inline-block"></span>Accuracy %</div>
              <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3)"><span style="width:10px;height:10px;border-radius:3px;background:#34D399;display:inline-block"></span>Daily target completion %</div>
            </div>
          </div>
        </section>

        <!-- Radar + Subject breakdown -->
        <section class="section">
          <div class="grid-2">
            <div class="card card--padded">
              <div class="card__header">
                <div>
                  <div class="card__title">${icon('bar-chart',16)} By subject</div>
                  <div class="card__sub">Accuracy from diagnostics</div>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px">
                ${buildSubjectBreakdown(s.subjects)}
              </div>
              <div class="divider"></div>
              ${s.subjects.map(subj => `
                <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-1)">
                  <div style="display:flex;align-items:center;gap:10px">
                    <div class="roadmap__icon" style="background:linear-gradient(135deg,${subj.color},${subj.color2})">${subj.init}</div>
                    <div>
                      <div style="font-size:13px;font-weight:500;color:var(--fg-1)">${subj.name}</div>
                      <div style="font-size:11px;color:var(--fg-4)">${subj.topic}</div>
                    </div>
                  </div>
                  <div style="text-align:right">
                    <div style="font-family:var(--font-mono);font-size:16px;font-weight:600;color:${subj.color}">${subj.accuracy}%</div>
                    <div style="font-size:11px;color:var(--fg-4)">accuracy</div>
                  </div>
                </div>`).join('')}
            </div>
            <div class="card card--padded">
              <div class="card__header">
                <div>
                  <div class="card__title">${icon('target',16)} Subject radar</div>
                  <div class="card__sub">Balanced coverage view</div>
                </div>
              </div>
              ${s.subjects.length ? buildRadarSVG(s.subjects) : `<div class="empty-state">${icon('target',28)}<p>Sem dados de diagnóstico</p></div>`}
              <div class="divider" style="margin-top:16px"></div>
              <div class="card__header" style="margin-top:16px;margin-bottom:12px">
                <div class="card__title">${icon('bar-chart',16)} Diagnóstico por tópico</div>
                <div class="card__sub">Taxa de acerto real por tópico</div>
              </div>
              ${_diagData && _diagData.length ? _diagData.slice(0,8).map(d => `
                <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border-1);font-size:12px">
                  <span style="flex:1;color:var(--fg-2)">${d.topicoNome || '—'}</span>
                  <span style="color:var(--fg-4)">${d.materiaNome || ''}</span>
                  <span style="font-family:var(--font-mono);color:var(--emerald-400);font-weight:500">${Math.round((d.taxaAcerto||0)*100)}%</span>
                </div>`).join('')
              : `<div style="color:var(--fg-4);font-size:12px;padding:12px 0">Sem dados de diagnóstico disponíveis.</div>`}
            </div>
          </div>
        </section>

        <!-- AI insights -->
        <section class="section">
          <div class="card ai-panel card--padded">
            <div class="card__header">
              <div>
                <div class="card__title" style="color:var(--fg-1)">${icon('sparkles',16)} Performance insights</div>
                <div class="card__sub">AI analysis based on your diagnostic data</div>
              </div>
              <button class="btn btn--ghost btn--sm" onclick="showToast('Refreshed!')">Refresh ${icon('refresh-cw',12)}</button>
            </div>
            <div class="grid-3" style="gap:12px">
              ${insightCards.map(m => `
                <div class="ai-msg" style="flex-direction:column;gap:10px">
                  <div style="display:flex;gap:10px;align-items:center">
                    <div class="ai-msg__icon" style="color:${m.color};background:${m.color}22;box-shadow:0 0 16px ${m.color}33;border:1px solid ${m.color}33">${icon(m.ico,14)}</div>
                    <span style="font-size:11px;color:var(--fg-4)">${m.meta}</span>
                  </div>
                  <div class="ai-msg__text">${m.text}</div>
                </div>`).join('')}
            </div>
          </div>
        </section>

        ${buildTechStrip()}
      </main>
    </div>`;

  const d = periods[activePeriod];
  document.getElementById('perf-chart-wrap').innerHTML = buildPerfChart(d.labels, d.acc, d.tasks, 600, 200);
}

// ── API data ────────────────────────────────────────────────
let _diagData  = null;
let _dashData  = null;
let _recomData = null;

// Merge diagnostic data into State.subjects for builders
function applyDiagnosticToSubjects() {
  if (!_diagData || !Array.isArray(_diagData)) return;

  // Group by materiaNome, average taxaAcerto
  const byMateria = {};
  _diagData.forEach(d => {
    const m = d.materiaNome || 'Outros';
    if (!byMateria[m]) byMateria[m] = { total: 0, count: 0 };
    byMateria[m].total += (d.taxaAcerto || 0);
    byMateria[m].count += 1;
  });

  if (State.subjects.length) {
    State.subjects.forEach(s => {
      const entry = byMateria[s.name];
      if (entry) {
        s.accuracy = Math.round((entry.total / entry.count) * 100);
        s.pct      = s.accuracy;
      }
    });
  } else {
    // Build subjects from diagnostic when /materias data is unavailable
    State.subjects = Object.entries(byMateria).map(([nome, v], i) => {
      const acc = Math.round((v.total / v.count) * 100);
      const p = SUBJECT_PALETTE[i % SUBJECT_PALETTE.length];
      return { id: i, name: nome, color: p.color, color2: p.color2,
               init: nome.slice(0,2).toUpperCase(), accuracy: acc, status: 'track', topic: '—', pct: acc };
    });
  }
}

async function init() {
  const uid = getUsuarioId();

  const [diagResult, dashResult, recomResult, materiaResult] = await Promise.allSettled([
    uid ? apiGet(`/diagnostico/usuario/${uid}`) : Promise.resolve(null),
    uid ? apiGet(`/dashboard/usuario/${uid}`)   : Promise.resolve(null),
    uid ? apiGet(`/recomendacao/usuario/${uid}`) : Promise.resolve(null),
    apiGet('/materias'),
  ]);

  _diagData  = diagResult.status  === 'fulfilled' ? diagResult.value  : null;
  _dashData  = dashResult.status  === 'fulfilled' ? dashResult.value  : null;
  _recomData = recomResult.status === 'fulfilled' ? recomResult.value : null;

  if (materiaResult.status === 'fulfilled' && Array.isArray(materiaResult.value)) {
    State.subjects = materiaResult.value.filter(m => m.ativa !== false).map(materiaToSubject);
  }
  applyDiagnosticToSubjects();

  render();
  initDrawer();

  const d = periods[activePeriod];
  document.getElementById('perf-chart-wrap').innerHTML = buildPerfChart(d.labels, d.acc, d.tasks, 600, 200);
}

init();
</script>
</body>
</html>
