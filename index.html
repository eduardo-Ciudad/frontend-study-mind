<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyMind — Dashboard</title>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/responsive.css"/>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast-container"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/shared.js"></script>
<script>
checkAuth();

// ── Render ───────────────────────────────────────────────────
// ── Dashboard data ──────────────────────────────────────────
let _dashData   = null;
let _recomData  = null;

function render() {
  const s = State;
  const pending = s.tasks.filter(t => t.status !== 'CONCLUIDA' && t.status !== 'CANCELADA').length;

  // Stats from dashboard API or fallback
  const totalRespostas   = _dashData ? _dashData.totalRespostas   : '—';
  const taxaAcerto       = _dashData ? Math.round(_dashData.taxaAcertoGeral * 100) + '%' : '—%';
  const fraco            = _dashData && _dashData.topicosMaisFracos && _dashData.topicosMaisFracos[0]
                             ? _dashData.topicosMaisFracos[0] : null;
  const fracoNome        = fraco ? (fraco.topicoNome || fraco.nome || 'N/A') : '—';
  const fracoMateria     = fraco ? (fraco.materiaNome || '') : '';
  const fracoTaxa        = fraco ? Math.round((fraco.taxaAcerto || 0) * 100) + '%' : '—';

  // AI insights from recommendation API or fallback
  const motivacional = _recomData ? _recomData.mensagemMotivacional : '';
  const dicas = _recomData && _recomData.dicasPraticas ? _recomData.dicasPraticas : [];
  const prioritarios = _recomData && _recomData.topicosPrioritarios ? _recomData.topicosPrioritarios : [];

  const aiInsights = [];
  if (motivacional) {
    aiInsights.push({ ico:'sparkles', text: motivacional, meta:'StudyMind AI · Motivação' });
  }
  prioritarios.slice(0, 2).forEach(t => {
    aiInsights.push({ ico:'alert', text: `Priorize: ${t.topicoNome || t.nome} (${t.materiaNome || ''})`, meta:'Tópico prioritário' });
  });
  dicas.slice(0, 3 - aiInsights.length).forEach(d => {
    aiInsights.push({ ico:'zap', text: d, meta:'Dica prática · StudyMind AI' });
  });
  // Fallback if no AI data
  if (!aiInsights.length) {
    aiInsights.push(
      { ico:'alert',      text:'Focus on your weakest topics to boost accuracy.', meta:'StudyMind AI' },
      { ico:'rotate-ccw', text:'Keep your study streak going — consistency is key.', meta:'StudyMind AI' },
      { ico:'zap',        text:'Review completed tasks to consolidate learning.',   meta:'StudyMind AI' }
    );
  }

  document.getElementById('app').innerHTML = `
    ${buildSidebar('dashboard')}
    <div>
      ${buildTopbar('Workspace','Dashboard')}
      <main class="main page-enter">

        <!-- HERO -->
        <section class="hero">
          <div class="hero-inner">
            <div>
              <span class="hero-eyebrow">${icon('sparkles',12)} AI-powered personalized learning</span>
              <h1 class="hero-title">Your <b>Study Roadmap</b></h1>
              <p class="hero-sub">Today's plan is calibrated to your weakest topics. Stay on the path — keep your streak alive!</p>
              <div class="row" style="gap:10px;margin-top:24px">
                <button class="btn btn--primary" onclick="showToast('Session started!')">
                  ${icon('play',14)} Start today's session
                </button>
                <a href="pages/roadmap.html" class="btn btn--secondary">
                  ${icon('route',14)} View full roadmap
                </a>
              </div>
            </div>
            <div class="hero-today-card">
              <div class="hero-today-label">${icon('sparkles',12)} Generated for today</div>
              <div style="font-size:14px;color:var(--fg-1);font-weight:500;margin-bottom:4px">${pending} pending tasks</div>
              <div style="font-size:12px;color:var(--fg-3);margin-bottom:14px">Based on your performance data</div>
              ${s.tasks.slice(0,3).map(t => `
                <div class="hero-task-row">
                  <span class="htdot htdot--ind"></span>
                  <span style="flex:1;color:var(--fg-1)">${t.descricao || t.titulo || '—'}</span>
                  <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-4)">${t.tipo || ''}</span>
                </div>`).join('')}
            </div>
          </div>
        </section>

        <!-- STATS -->
        <section class="section">
          <div class="grid-stats">
            <div class="card stat card--hover">
              <div class="stat__head">
                <div class="stat__icon stat__icon--em">${icon('check-circle',16)}</div>
              </div>
              <div class="stat__label">Total respostas</div>
              <div class="stat__value">${totalRespostas}</div>
              <div class="stat__sub">Todas as matérias</div>
            </div>
            <div class="card stat card--hover">
              <div class="stat__head">
                <div class="stat__icon">${icon('target',16)}</div>
              </div>
              <div class="stat__label">Taxa de acerto</div>
              <div class="stat__value">${taxaAcerto}</div>
              <div class="stat__sub">Média geral</div>
            </div>
            <div class="card stat card--hover">
              <div class="stat__head">
                <div class="stat__icon stat__icon--am">${icon('check-square',16)}</div>
              </div>
              <div class="stat__label">Tarefas pendentes</div>
              <div class="stat__value">${pending}</div>
              <div class="stat__sub">${s.tasks.length} total</div>
            </div>
            <div class="card stat card--hover">
              <div class="stat__head">
                <div class="stat__icon stat__icon--rs">${icon('alert',16)}</div>
              </div>
              <div class="stat__label">Tópico mais fraco</div>
              <div class="stat__value" style="font-size:${fracoNome.length > 6 ? '16px' : '22px'}">${fracoNome}</div>
              <div class="stat__sub">${fracoMateria} · ${fracoTaxa} acerto</div>
            </div>
          </div>
        </section>

        <!-- ROADMAP PREVIEW -->
        <section class="section">
          <div class="card card--padded">
            <div class="card__header">
              <div>
                <div class="card__title">${icon('route',16)} Roadmap progress</div>
                <div class="card__sub">By subject · ENEM 2026 prep</div>
              </div>
              <a href="pages/roadmap.html" class="btn btn--ghost btn--sm">View all ${icon('arrow-right',12)}</a>
            </div>
            ${buildRoadmapRows(s.subjects.length ? s.subjects : State.roadmap.map((r,i) => ({
              id:i, name:r.subject, color:'#6366F1', color2:'#818CF8',
              init:r.subject[0], accuracy:r.pct, status:'track', topic:r.current, pct:r.pct
            })))}
          </div>
        </section>

        <!-- PERF + BREAKDOWN -->
        <section class="section">
          <div class="grid-2">
            <div class="card card--padded">
              <div class="card__header">
                <div>
                  <div class="card__title">${icon('trending',16)} Performance over time</div>
                  <div class="card__sub">Last 7 days · accuracy & daily target completion</div>
                </div>
                <div class="row">
                  <button class="btn btn--secondary btn--sm">7d</button>
                  <button class="btn btn--ghost btn--sm">30d</button>
                  <button class="btn btn--ghost btn--sm">90d</button>
                </div>
              </div>
              <div style="height:220px;margin-top:8px">${buildPerfChart(s.performance.labels, s.performance.accuracy, s.performance.tasks)}</div>
              <div style="display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border-1)">
                <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3)"><span style="width:10px;height:10px;border-radius:3px;background:#818CF8;display:inline-block"></span>Accuracy %</div>
                <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3)"><span style="width:10px;height:10px;border-radius:3px;background:#34D399;display:inline-block"></span>Daily target %</div>
              </div>
            </div>
            <div class="card card--padded">
              <div class="card__header">
                <div>
                  <div class="card__title">${icon('bar-chart',16)} Accuracy by subject</div>
                  <div class="card__sub">Based on diagnostics</div>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:10px">${buildSubjectBreakdown(s.subjects)}</div>
            </div>
          </div>
        </section>

        <!-- TASKS + AI -->
        <section class="section">
          <div class="grid-2">
            <div class="card card--padded">
              <div class="card__header">
                <div>
                  <div class="card__title">${icon('check-square',16)} Today's tasks</div>
                  <div class="card__sub">${pending} pending · ${s.tasks.filter(t=>t.status==='CONCLUIDA').length} done</div>
                </div>
                <a href="pages/tasks.html" class="btn btn--secondary btn--sm">${icon('arrow-right',12)} See all</a>
              </div>
              <div id="task-list"></div>
            </div>
            <div class="card ai-panel card--padded">
              <div class="card__header">
                <div>
                  <div class="card__title" style="color:var(--fg-1)">${icon('sparkles',16)} AI insights</div>
                  <div class="card__sub">Generated from your performance data</div>
                </div>
                <button class="btn btn--ghost btn--sm" onclick="loadAI()">Refresh ${icon('refresh-cw',12)}</button>
              </div>
              <div id="ai-panel-content">
                ${aiInsights.map(m => `
                  <div class="ai-msg">
                    <div class="ai-msg__icon">${icon(m.ico,14)}</div>
                    <div class="ai-msg__body">
                      <div class="ai-msg__text">${m.text}</div>
                      <div class="ai-msg__meta"><b>StudyMind AI</b> · ${m.meta}</div>
                    </div>
                  </div>`).join('')}
              </div>
            </div>
          </div>
        </section>

        ${buildTechStrip()}
      </main>
    </div>`;

  renderTasks();
}

function renderTasks() {
  const tasks = State.tasks.slice(0, 5);
  const el = document.getElementById('task-list');
  if (!el) return;
  if (!tasks.length) {
    el.innerHTML = `<div class="empty-state">${icon('check-square',32)}<p>Nenhuma tarefa encontrada</p></div>`;
    return;
  }
  el.innerHTML = tasks.map(t => {
    const done = t.status === 'CONCLUIDA';
    return `
    <div class="task${done ? ' task--done':''}" onclick="toggleTask(${t.id})">
      <div class="task__check">${icon('check',10)}</div>
      <div>
        <div class="task__title">${t.descricao || t.titulo || '—'}</div>
        <div class="task__sub">${t.tipo || ''} · ${t.topicoNome || ''}</div>
      </div>
      <span class="badge badge--muted">${t.tipo || ''}</span>
      <div class="task__time">${t.prazo ? t.prazo.slice(0,10) : '—'}</div>
    </div>`;
  }).join('');
}

async function toggleTask(id) {
  const t = State.tasks.find(t => t.id === id);
  if (!t) return;
  const newStatus = t.status === 'CONCLUIDA' ? 'PENDENTE' : 'CONCLUIDA';
  try {
    await apiPut(`/tarefas/${id}`, { ...t, status: newStatus });
    t.status = newStatus;
    showToast(newStatus === 'CONCLUIDA' ? 'Task completed!' : 'Task reopened');
    renderTasks();
  } catch(err) { handleApiError(err); }
}

async function loadAI() {
  const uid = getUsuarioId();
  if (!uid) return;
  try {
    _recomData = await apiGet(`/recomendacao/usuario/${uid}`);
    render();
  } catch(err) { handleApiError(err); }
}

async function loadDashboard() {
  const uid = getUsuarioId();
  if (!uid) return;
  try {
    [_dashData] = await Promise.allSettled([
      apiGet(`/dashboard/usuario/${uid}`),
    ]).then(r => r.map(x => x.status === 'fulfilled' ? x.value : null));
  } catch { _dashData = null; }
}

async function loadTasks() {
  const uid = getUsuarioId();
  if (!uid) return;
  try {
    const data = await apiGet(`/tarefas/usuario/${uid}`);
    State.tasks = Array.isArray(data) ? data : [];
  } catch(err) { handleApiError(err); }
}

async function loadSubjects() {
  try {
    const data = await apiGet('/materias');
    State.subjects = Array.isArray(data)
      ? data.filter(m => m.ativa !== false).map(materiaToSubject)
      : [];
  } catch { State.subjects = []; }
}

async function init() {
  await Promise.all([loadDashboard(), loadTasks(), loadSubjects()]);
  // Load AI in parallel without blocking render
  apiGet(`/recomendacao/usuario/${getUsuarioId()}`).then(d => { _recomData = d; }).catch(() => {});
  render();
  initDrawer();
}

init();
</script>

<style>
.hero {
  border-radius: var(--r-3xl); padding: 32px; position: relative; overflow: hidden;
  border: 1px solid rgba(99,102,241,0.18);
  background: radial-gradient(600px 300px at 100% 0%, rgba(99,102,241,0.18), transparent 60%),
              radial-gradient(500px 280px at 0% 100%, rgba(16,185,129,0.10), transparent 60%),
              linear-gradient(180deg,#141B33 0%,#0F1626 100%);
  box-shadow: var(--shadow-lg), var(--inner-card);
}
.hero::after {
  content:""; position:absolute; inset:0;
  background-image: var(--pattern-dots); background-size: var(--pattern-dots-size);
  opacity:0.5; pointer-events:none;
  mask-image: radial-gradient(ellipse at top right, black 0%, transparent 70%);
}
.hero-inner { position:relative; z-index:1; display:grid; grid-template-columns:1.4fr 1fr; gap:32px; align-items:center; }
.hero-eyebrow {
  display:inline-flex; align-items:center; gap:8px;
  font-size:12px; font-weight:500; color:var(--indigo-200);
  background:rgba(99,102,241,0.12); border:1px solid rgba(99,102,241,0.25);
  padding:6px 12px; border-radius:var(--r-pill); margin-bottom:16px;
}
.hero-eyebrow .icon { width:12px; height:12px; }
.hero-title { font-size:38px; font-weight:600; letter-spacing:-0.025em; color:var(--fg-1); line-height:1.1; margin:0 0 12px; }
.hero-title b { background:linear-gradient(135deg,#818CF8 0%,#34D399 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero-sub { font-size:15px; color:var(--fg-3); max-width:500px; }
.hero-today-card {
  background:rgba(11,15,26,0.55); backdrop-filter:blur(12px);
  border:1px solid var(--border-2); border-radius:var(--r-xl); padding:18px; position:relative;
}
.hero-today-label { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:600; letter-spacing:0.1em; text-transform:uppercase; color:var(--indigo-400); margin-bottom:12px; }
.hero-today-label .icon { width:12px; height:12px; }
.hero-task-row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.02); border:1px solid var(--border-1); font-size:13px; margin-bottom:6px; }
.hero-task-row:last-child { margin-bottom:0; }
.htdot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
.htdot--ind { background:var(--indigo-500); box-shadow:0 0 8px var(--indigo-glow); }
.htdot--em  { background:var(--emerald-500); box-shadow:0 0 8px var(--emerald-glow); }
</style>
</body>
</html>
