<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyMind — Subjects</title>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast-container"></div>

<!-- Add Topic Modal -->
<div class="modal-overlay" id="modal-topic">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title">Add topic</div>
      <button class="modal__close" data-modal-close>${icon_raw('x')}</button>
    </div>
    <div class="col">
      <div class="form-group">
        <label class="form-label">Subject</label>
        <select class="form-input" id="new-topic-subject">
          <option value="">Matéria selecionada automaticamente</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Topic name</label>
        <input class="form-input" id="new-topic-name" placeholder="e.g. Quadratic functions"/>
      </div>
      <div class="form-group">
        <label class="form-label">Difficulty</label>
        <select class="form-input" id="new-topic-diff">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" data-modal-close>Cancel</button>
      <button class="btn btn--primary" onclick="addTopic()">Add topic</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/shared.js"></script>
<script>
checkAuth();

function icon_raw(name) {
  const map = {
    x: `<svg class="icon" width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
  };
  return map[name] || '';
}

// topicsData keyed by materia ID → array of topico API objects
const topicsData = {};
// activeSubject = materia object from State.subjects
let activeSubject = null;

const diffMap = { easy:'FACIL', medium:'MEDIO', hard:'DIFICIL' };
const diffFromApi = { FACIL:'easy', MEDIO:'medium', DIFICIL:'hard' };
const diffColor = { easy:'emerald', medium:'amber', hard:'rose', FACIL:'emerald', MEDIO:'amber', DIFICIL:'rose' };

async function setActiveSubject(subj) {
  activeSubject = subj;
  document.querySelectorAll('.subj-card').forEach(c =>
    c.classList.toggle('subj-card--active', Number(c.dataset.id) === subj.id));

  if (!topicsData[subj.id]) {
    try {
      const data = await apiGet(`/topicos?materiaId=${subj.id}`);
      topicsData[subj.id] = Array.isArray(data) ? data : [];
    } catch(err) { handleApiError(err); topicsData[subj.id] = []; }
  }
  renderTopics();
}

function renderTopics() {
  const subj = activeSubject;
  if (!subj) return;
  const topics = topicsData[subj.id] || [];
  const done = topics.filter(t => !t.ativo).length;

  document.getElementById('topic-panel').innerHTML = `
    <div class="card card--padded" style="height:100%">
      <div class="card__header">
        <div style="display:flex;align-items:center;gap:12px">
          <div class="roadmap__icon" style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,${subj.color},${subj.color2})">${subj.init}</div>
          <div>
            <div class="card__title" style="font-size:18px">${subj.name}</div>
            <div class="card__sub">${done}/${topics.length} topics covered · ${subj.accuracy}% accuracy</div>
          </div>
        </div>
        <button class="btn btn--primary btn--sm" onclick="openModal('modal-topic')">${icon('plus',12)} Add topic</button>
      </div>

      <div class="progress-bar" style="margin-bottom:24px">
        <div class="progress-bar__fill" style="width:${subj.pct}%;background:linear-gradient(90deg,${subj.color},${subj.color2});box-shadow:0 0 12px ${subj.color}44"></div>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px">
        ${topics.length ? topics.map(t => {
          const isDone = !t.ativo;
          const nivel = t.nivelDificuldade || t.nivel || 'MEDIO';
          const dc = diffColor[nivel] || 'muted';
          return `
          <div class="topic-item${isDone ? ' topic-item--done' : ''}" onclick="toggleTopicDone(${t.id})">
            <div class="task__check">${icon('check',10)}</div>
            <div style="flex:1">
              <div style="font-size:14px;font-weight:500;color:${isDone ? 'var(--fg-4)' : 'var(--fg-1)'};${isDone ? 'text-decoration:line-through':''}">
                ${t.nome}
              </div>
            </div>
            <span class="badge badge--${dc}">${nivel}</span>
            <button class="btn btn--ghost btn--sm btn--icon" onclick="event.stopPropagation();showToast('Edit: ${t.nome}')" title="Edit">
              ${icon('edit',13)}
            </button>
          </div>`;
        }).join('') : `<div class="empty-state">${icon('book',28)}<p>Nenhum tópico cadastrado</p></div>`}
      </div>
    </div>`;
}

async function toggleTopicDone(topicoId) {
  const topics = topicsData[activeSubject.id] || [];
  const t = topics.find(x => x.id === topicoId);
  if (!t) return;
  const newAtivo = !t.ativo;
  try {
    await apiPut(`/topicos/${topicoId}`, { nome: t.nome, nivelDificuldade: t.nivelDificuldade || t.nivel, ativo: newAtivo });
    t.ativo = newAtivo;
    showToast(newAtivo ? `"${t.nome}" reopened` : `"${t.nome}" marked complete!`);
    renderTopics();
  } catch(err) { handleApiError(err); }
}

async function addTopic() {
  if (!activeSubject) { showToast('Selecione uma matéria', 'error'); return; }
  const name = document.getElementById('new-topic-name').value.trim();
  const diff = document.getElementById('new-topic-diff').value;
  if (!name) { showToast('Fill all fields', 'error'); return; }

  const nivel = diffMap[diff] || 'MEDIO';
  try {
    const novo = await apiPost('/topicos', {
      nome: name,
      descricao: '',
      nivelDificuldade: nivel,
      materiaId: activeSubject.id,
    });
    if (!topicsData[activeSubject.id]) topicsData[activeSubject.id] = [];
    topicsData[activeSubject.id].push({ ...novo, ativo: true });
    closeModal('modal-topic');
    renderTopics();
    showToast(`Tópico "${name}" adicionado!`);
    document.getElementById('new-topic-name').value = '';
  } catch(err) { handleApiError(err); }
}

function render() {
  document.getElementById('app').innerHTML = `
    ${buildSidebar('subjects')}
    <div>
      ${buildTopbar('Workspace','Subjects')}
      <main class="main page-enter">

        <div class="section__head">
          <div>
            <h1 class="section__title">${icon('book',20)} Subjects & Topics</h1>
            <p class="section__sub">Track your coverage per subject and manage individual topics</p>
          </div>
          <button class="btn btn--primary btn--sm" onclick="openModal('modal-topic')">${icon('plus',12)} New topic</button>
        </div>

        <div class="subj-layout">
          <!-- Subject cards sidebar -->
          <div style="display:flex;flex-direction:column;gap:10px">
            ${State.subjects.length ? State.subjects.map(s => {
              const topics = topicsData[s.id] || [];
              const done = topics.filter(t => !t.ativo).length;
              const statusColor = 'emerald';
              return `
              <div class="subj-card${activeSubject && activeSubject.id === s.id ? ' subj-card--active' : ''}"
                   data-id="${s.id}" onclick="setActiveSubject(State.subjects.find(x=>x.id===${s.id}))"
                   style="--subj-color:${s.color}">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
                  <div class="roadmap__icon" style="background:linear-gradient(135deg,${s.color},${s.color2})">${s.init}</div>
                  <div style="flex:1">
                    <div style="font-size:14px;font-weight:600;color:var(--fg-1)">${s.name}</div>
                    <span class="badge badge--${statusColor}" style="font-size:10px;padding:2px 7px">Ativo</span>
                  </div>
                  <div style="font-family:var(--font-mono);font-size:16px;font-weight:600;color:var(--fg-1)">${topics.length} tópicos</div>
                </div>
                <div class="progress-bar" style="height:5px;margin-bottom:8px">
                  <div class="progress-bar__fill" style="width:${s.pct}%;background:linear-gradient(90deg,${s.color},${s.color2})"></div>
                </div>
                <div style="font-size:11px;color:var(--fg-4)">${done}/${topics.length} done · ${s.topic}</div>
              </div>`;
            }).join('') : `<div class="empty-state">${icon('book',28)}<p>Nenhuma matéria cadastrada</p></div>`}
          </div>

          <!-- Topics panel -->
          <div id="topic-panel">
            <div class="card card--padded" style="height:100%;display:flex;align-items:center;justify-content:center">
              <div class="empty-state">${icon('book',28)}<p>Selecione uma matéria</p></div>
            </div>
          </div>
        </div>

        ${buildTechStrip()}
      </main>
    </div>`;

  initModals();
  if (activeSubject) renderTopics();
}

async function init() {
  try {
    const data = await apiGet('/materias');
    State.subjects = Array.isArray(data)
      ? data.filter(m => m.ativa !== false).map(materiaToSubject)
      : [];
  } catch(err) { handleApiError(err); }

  render();
  initDrawer();

  // Auto-select first subject
  if (State.subjects.length) {
    await setActiveSubject(State.subjects[0]);
    render();
  }
}

init();
</script>

<style>
.subj-layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; margin-top: 20px; }
.subj-card {
  padding: 16px; border-radius: var(--r-xl);
  background: var(--bg-4); background-image: var(--grad-card);
  border: 1px solid var(--border-2);
  cursor: pointer; transition: all var(--dur-base) var(--ease-out);
}
.subj-card:hover { border-color: var(--border-3); background-color: var(--bg-5); }
.subj-card--active {
  border-color: var(--subj-color, var(--indigo-500));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--subj-color, #6366F1) 30%, transparent), 0 0 20px color-mix(in srgb, var(--subj-color, #6366F1) 15%, transparent);
}
.topic-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: var(--r-md);
  border: 1px solid var(--border-1);
  background: rgba(255,255,255,0.015);
  cursor: pointer; transition: all var(--dur-base) var(--ease-out);
}
.topic-item:hover { border-color: var(--border-3); background: rgba(255,255,255,0.025); }
.topic-item--done .task__check { background: var(--emerald-500); border-color: var(--emerald-500); box-shadow: 0 0 12px var(--emerald-glow); }
.topic-item--done .task__check .icon { display: block; }
</style>
</body>
</html>
