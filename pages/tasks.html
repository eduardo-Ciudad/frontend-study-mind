<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StudyMind — Tasks</title>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/responsive.css"/>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast-container"></div>

<!-- Add task modal -->
<div class="modal-overlay" id="modal-task">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title">New task</div>
      <button class="modal__close" data-modal-close>
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="col">
      <div class="form-group">
        <label class="form-label">Descrição</label>
        <input class="form-input" id="new-task-title" placeholder="e.g. Revisar funções quadráticas"/>
      </div>
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select class="form-input" id="new-task-subject">
          <option value="REVISAO">Revisão</option>
          <option value="PRATICA">Prática</option>
          <option value="LEITURA">Leitura</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Matéria</label>
        <select class="form-input" id="new-task-materia" onchange="onMateriaChange()">
          <option value="">Selecione a matéria</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Tópico</label>
        <select class="form-input" id="new-task-topico">
          <option value="">Selecione o tópico</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Prazo</label>
        <input class="form-input" id="new-task-time" type="date"/>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn--ghost" data-modal-close>Cancel</button>
      <button class="btn btn--primary" onclick="addTask()">Create task</button>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/shared.js"></script>
<script>
checkAuth();

let filterSubject = 'all';
let filterStatus  = 'all';
let sortBy = 'default';

function getFiltered() {
  return State.tasks
    .filter(t => filterSubject === 'all' || (t.materiaNome || '') === filterSubject)
    .filter(t => {
      if (filterStatus === 'all') return true;
      if (filterStatus === 'done')    return t.status === 'CONCLUIDA';
      if (filterStatus === 'pending') return t.status === 'PENDENTE';
      return true;
    })
    .sort((a,b) => sortBy === 'title'
      ? (a.descricao || '').localeCompare(b.descricao || '')
      : 0);
}

async function toggleTask(id) {
  const t = State.tasks.find(t => t.id === id);
  if (!t) return;
  const newStatus = t.status === 'CONCLUIDA' ? 'PENDENTE' : 'CONCLUIDA';
  try {
    await apiPut(`/tarefas/${id}`, { ...t, status: newStatus });
    t.status = newStatus;
    showToast(newStatus === 'CONCLUIDA' ? 'Task completed!' : 'Task reopened');
    renderTasks();
  } catch(err) { handleApiError(err); }
}

async function deleteTask(id) {
  try {
    await apiDelete(`/tarefas/${id}`);
    const idx = State.tasks.findIndex(t => t.id === id);
    if (idx !== -1) State.tasks.splice(idx, 1);
    showToast('Tarefa cancelada');
    renderTasks();
  } catch(err) { handleApiError(err); }
}

async function addTask() {
  const desc    = document.getElementById('new-task-title').value.trim();
  const tipo    = document.getElementById('new-task-subject').value; // repurposed as tipo
  const topicoId = Number(document.getElementById('new-task-topico').value);
  const prazo   = document.getElementById('new-task-time').value || null;
  const uid     = Number(getUsuarioId());

  if (!desc) { showToast('Descrição é obrigatória', 'error'); return; }
  if (!topicoId) { showToast('Selecione um tópico', 'error'); return; }

  try {
    const nova = await apiPost('/tarefas', {
      usuarioId: uid,
      topicoId,
      tipo: tipo || 'REVISAO',
      descricao: desc,
      meta: 10,
      prazo: prazo || null,
    });
    State.tasks.unshift(nova);
    closeModal('modal-task');
    document.getElementById('new-task-title').value = '';
    document.getElementById('new-task-time').value  = '';
    renderTasks();
    showToast(`Tarefa "${desc}" criada!`);
  } catch(err) { handleApiError(err); }
}

// Populate tópico select when materia changes in the modal
async function onMateriaChange() {
  const materiaId = Number(document.getElementById('new-task-materia').value);
  const sel = document.getElementById('new-task-topico');
  sel.innerHTML = '<option value="">Carregando...</option>';
  if (!materiaId) { sel.innerHTML = '<option value="">Selecione um tópico</option>'; return; }
  try {
    const data = await apiGet(`/topicos?materiaId=${materiaId}`);
    const topicos = Array.isArray(data) ? data.filter(t => t.ativo !== false) : [];
    sel.innerHTML = topicos.length
      ? topicos.map(t => `<option value="${t.id}">${t.nome}</option>`).join('')
      : '<option value="">Nenhum tópico disponível</option>';
  } catch { sel.innerHTML = '<option value="">Erro ao carregar tópicos</option>'; }
}

function renderTasks() {
  const tasks = getFiltered();
  const pending = State.tasks.filter(t => t.status === 'PENDENTE').length;
  const done    = State.tasks.filter(t => t.status === 'CONCLUIDA').length;

  document.getElementById('task-summary').innerHTML = `
    <span style="color:var(--fg-1);font-weight:500">${pending}</span> pending &nbsp;·&nbsp;
    <span style="color:var(--emerald-400);font-weight:500">${done}</span> done &nbsp;·&nbsp;
    <span style="color:var(--fg-4)">${State.tasks.length} total</span>`;

  const list = document.getElementById('tasks-list');
  if (!tasks.length) {
    list.innerHTML = `<div class="empty-state">${icon('check-square',32)}<p>No tasks match the current filter</p></div>`;
    return;
  }

  list.innerHTML = tasks.map(t => {
    const done = t.status === 'CONCLUIDA';
    return `
    <div class="task${done ? ' task--done':''}">
      <div class="task__check" onclick="event.stopPropagation();toggleTask(${t.id})">${icon('check',10)}</div>
      <div onclick="toggleTask(${t.id})">
        <div class="task__title">${t.descricao || '—'}</div>
        <div class="task__sub">${t.tipo || ''} · ${t.topicoNome || t.materiaNome || ''}</div>
      </div>
      <span class="badge badge--muted">${t.tipo || ''}</span>
      <div class="task__time">${t.prazo ? t.prazo.slice(0,10) : '—'}</div>
      <button class="btn btn--ghost btn--sm btn--icon" onclick="deleteTask(${t.id})" title="Cancelar tarefa" style="color:var(--fg-4)">
        ${icon('trash',13)}
      </button>
    </div>`;
  }).join('');
}

function render() {
  const subjNames = ['all', ...State.subjects.map(s => s.name)];

  document.getElementById('app').innerHTML = `
    ${buildSidebar('tasks')}
    <div>
      ${buildTopbar('Workspace','Tasks')}
      <main class="main page-enter">

        <div class="section__head">
          <div>
            <h1 class="section__title">${icon('check-square',20)} Tasks</h1>
            <p class="section__sub" id="task-summary"></p>
          </div>
          <button class="btn btn--primary" onclick="openModal('modal-task')">${icon('plus',14)} New task</button>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar">
          <div class="filter-group">
            <span class="filter-label">Matéria</span>
            <div class="filter-pills" id="filter-subject">
              ${subjNames.map(s => `<button class="filter-pill${filterSubject===s?' active':''}" onclick="setFilter('subject','${s}')">${s==='all'?'All':s}</button>`).join('')}
            </div>
          </div>
          <div style="flex:1"></div>
          <div class="row" style="gap:8px">
            <select class="form-input" style="width:auto;padding:7px 12px;font-size:13px" onchange="filterStatus=this.value;renderTasks()">
              <option value="all">All status</option>
              <option value="pending">Pending</option>
              <option value="done">Done</option>
            </select>
            <select class="form-input" style="width:auto;padding:7px 12px;font-size:13px" onchange="sortBy=this.value;renderTasks()">
              <option value="default">Sort: Default</option>
              <option value="title">Sort: Name</option>
            </select>
          </div>
        </div>

        <!-- Stats row -->
        <div class="grid-4" style="margin:20px 0">
          ${[
            {label:'Pending',   val:State.tasks.filter(t=>t.status==='PENDENTE').length,   ico:'clock',        cls:''},
            {label:'Completed', val:State.tasks.filter(t=>t.status==='CONCLUIDA').length,  ico:'check-circle', cls:'stat__icon--em'},
            {label:'Cancelled', val:State.tasks.filter(t=>t.status==='CANCELADA').length,  ico:'alert',        cls:'stat__icon--rs'},
            {label:'Total',     val:State.tasks.length,                                    ico:'calendar',     cls:'stat__icon--am'},
          ].map(c => `
            <div class="card stat card--hover">
              <div class="stat__head"><div class="stat__icon ${c.cls}">${icon(c.ico,16)}</div></div>
              <div class="stat__label">${c.label}</div>
              <div class="stat__value">${c.val}</div>
            </div>`).join('')}
        </div>

        <!-- Task list -->
        <div class="card card--padded">
          <div id="tasks-list"></div>
        </div>

        ${buildTechStrip()}
      </main>
    </div>`;

  initModals();
  renderTasks();
}

function setFilter(type, val) {
  if (type === 'subject') filterSubject = val;
  document.querySelectorAll(`#filter-${type} .filter-pill`).forEach(p =>
    p.classList.toggle('active', p.textContent.trim() === (val === 'all' ? 'All' : val)));
  renderTasks();
}

async function init() {
  // Load materias and tasks in parallel
  const uid = getUsuarioId();
  await Promise.all([
    apiGet('/materias').then(d => {
      State.subjects = Array.isArray(d) ? d.filter(m => m.ativa !== false).map(materiaToSubject) : [];
    }).catch(() => {}),
    uid ? apiGet(`/tarefas/usuario/${uid}`).then(d => {
      State.tasks = Array.isArray(d) ? d : [];
    }).catch(() => {}) : Promise.resolve(),
  ]);

  // Populate modal materia select
  const matSel = document.getElementById('new-task-materia');
  if (matSel) {
    matSel.innerHTML = State.subjects.map(s =>
      `<option value="${s.id}">${s.name}</option>`).join('');
  }

  render();
  initDrawer();
}

init();
</script>

<style>
.filter-bar {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 16px;
  background: var(--bg-3); border: 1px solid var(--border-1);
  border-radius: var(--r-xl);
  margin-top: 20px;
  flex-wrap: wrap;
}
.filter-label { font-size: 11px; color: var(--fg-4); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 500; white-space: nowrap; }
.filter-group { display: flex; align-items: center; gap: 8px; }
.filter-pills { display: flex; gap: 4px; flex-wrap: wrap; }
.filter-pill {
  padding: 5px 12px; border-radius: var(--r-pill);
  font-size: 12px; font-weight: 500;
  background: transparent; color: var(--fg-3);
  border: 1px solid transparent;
  cursor: pointer; transition: all var(--dur-base) var(--ease-out);
  font-family: inherit;
}
.filter-pill:hover { background: var(--bg-4); color: var(--fg-1); }
.filter-pill.active { background: rgba(99,102,241,0.12); color: var(--indigo-400); border-color: rgba(99,102,241,0.25); }
.task { grid-template-columns: 22px 1fr auto auto auto !important; }
</style>
</body>
</html>
